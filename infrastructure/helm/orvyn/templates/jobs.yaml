{{- if and (eq .Values.storage.driver "s3") .Values.storage.s3.internal.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orvyn.fullname" . | trunc 39 | trimSuffix "-" }}-storage-init-{{ toJson (dict "fullname" (include "orvyn.fullname" .) "storage" .Values.storage.s3 "api" .Values.api "configuration" (pick .Values.configuration "resources" "activeDeadlineSeconds" "backoffLimit") "global" .Values.global "version" .Chart.AppVersion) | sha256sum | trunc 10 }}
  labels: {{- include "orvyn.labels" . | nindent 4 }}
spec:
  activeDeadlineSeconds: {{ .Values.configuration.activeDeadlineSeconds }}
  backoffLimit: {{ .Values.configuration.backoffLimit }}
  template:
    metadata:
      labels: {{- include "orvyn.selector" (dict "root" . "component" "storage-init") | nindent 8 }}
      annotations:
        checksum/storage: {{ toJson .Values.storage.s3 | sha256sum | quote }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "orvyn.serviceAccount" . }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.api.podSecurityContext | nindent 8 }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: storage-init
          image: {{ include "orvyn.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: [node, dist/commands/storage-init.js]
          securityContext: {{- toYaml .Values.api.securityContext | nindent 12 }}
          resources: {{- toYaml .Values.configuration.resources | nindent 12 }}
          env:
            - name: NODE_ENV
              value: production
            - name: ORVYN_LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            {{- include "orvyn.storageEnv" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
