{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orvyn.fullname" . }}-postgresql
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}

spec:
  clusterIP: None

  selector:
    {{- include "orvyn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql

  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "orvyn.fullname" . }}-postgresql
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}

spec:
  serviceName: {{ include "orvyn.fullname" . }}-postgresql
  replicas: 1

  selector:
    matchLabels:
      {{- include "orvyn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgresql

  template:
    metadata:
      labels:
        {{- include "orvyn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      containers:
        - name: postgresql
          image: {{ printf "%s:%s" .Values.postgresql.image.repository .Values.postgresql.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}

            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "orvyn.secretName" . }}
                  key: POSTGRES_PASSWORD

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: postgres
            periodSeconds: 15

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}

      {{- if not .Values.postgresql.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}

  {{- if .Values.postgresql.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data

      spec:
        accessModes:
          - ReadWriteOnce

        {{- include "orvyn.storageClass" (dict "root" . "persistence" .Values.postgresql.persistence) | nindent 8 }}

        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size | quote }}
  {{- end }}
{{- end }}
