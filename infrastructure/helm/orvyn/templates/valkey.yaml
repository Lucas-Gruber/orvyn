{{- if .Values.valkey.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orvyn.fullname" . }}-valkey
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}

spec:
  clusterIP: None

  selector:
    {{- include "orvyn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: valkey

  ports:
    - name: redis
      port: 6379
      targetPort: redis

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "orvyn.fullname" . }}-valkey
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}

spec:
  serviceName: {{ include "orvyn.fullname" . }}-valkey
  replicas: 1

  selector:
    matchLabels:
      {{- include "orvyn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey

  template:
    metadata:
      labels:
        {{- include "orvyn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: valkey

    spec:
      automountServiceAccountToken: false

      containers:
        - name: valkey
          image: {{ printf "%s:%s" .Values.valkey.image.repository .Values.valkey.image.tag | quote }}
          imagePullPolicy: {{ .Values.valkey.image.pullPolicy }}

          command:
            - /bin/sh
            - -ec

          args:
            - |
              exec valkey-server \
                --bind 0.0.0.0 \
                --protected-mode yes \
                --requirepass "$VALKEY_PASSWORD" \
                --dir /data \
                {{- if .Values.valkey.persistence.enabled }}
                --appendonly yes
                {{- else }}
                --appendonly no --save ""
                {{- end }}

          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "orvyn.secretName" . }}
                  key: VALKEY_PASSWORD

          ports:
            - name: redis
              containerPort: 6379

          startupProbe:
            tcpSocket:
              port: redis
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - VALKEYCLI_AUTH="$VALKEY_PASSWORD" valkey-cli ping
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 15

          volumeMounts:
            - name: data
              mountPath: /data

          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}

      {{- if not .Values.valkey.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}

  {{- if .Values.valkey.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce

        {{- include "orvyn.storageClass" (dict "root" . "persistence" .Values.valkey.persistence) | nindent 8 }}

        resources:
          requests:
            storage: {{ .Values.valkey.persistence.size | quote }}
  {{- end }}
{{- end }}
