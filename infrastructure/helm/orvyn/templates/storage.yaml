{{- if .Values.storage.internal.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orvyn.fullname" . }}-storage
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}

spec:
  clusterIP: None

  selector:
    {{- include "orvyn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: storage

  ports:
    - name: s3
      port: 8333
      targetPort: s3

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "orvyn.fullname" . }}-storage
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}

spec:
  serviceName: {{ include "orvyn.fullname" . }}-storage
  replicas: 1

  selector:
    matchLabels:
      {{- include "orvyn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: storage

  template:
    metadata:
      labels:
        {{- include "orvyn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: storage

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60

      containers:
        - name: seaweedfs
          image: {{ printf "%s:%s" .Values.storage.internal.image.repository .Values.storage.internal.image.tag | quote }}
          imagePullPolicy: {{ .Values.storage.internal.image.pullPolicy }}

          args:
            - mini
            - -dir=/data
            - -ip=127.0.0.1
            - -ip.bind=0.0.0.0
            - -webdav=false
            - -admin.ui=false
            - -s3.config=/etc/orvyn/s3.json
            - -s3.allowDeleteBucketNotEmpty=false

          ports:
            - name: s3
              containerPort: 8333

          startupProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 15

          volumeMounts:
            - name: data
              mountPath: /data

            - name: s3-config
              mountPath: /etc/orvyn
              readOnly: true

          resources:
            {{- toYaml .Values.storage.internal.resources | nindent 12 }}

      volumes:
        - name: s3-config
          secret:
            secretName: {{ include "orvyn.secretName" . }}
            items:
              - key: s3.json
                path: s3.json

        {{- if not .Values.storage.internal.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}

  {{- if .Values.storage.internal.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce

        {{- include "orvyn.storageClass" (dict "root" . "persistence" .Values.storage.internal.persistence) | nindent 8 }}

        resources:
          requests:
            storage: {{ .Values.storage.internal.persistence.size | quote }}
  {{- end }}

---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orvyn.fullname" . }}-storage-bootstrap
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}

  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

spec:
  backoffLimit: 6
  activeDeadlineSeconds: 600

  template:
    metadata:
      name: {{ include "orvyn.fullname" . }}-storage-bootstrap-{{ .Release.Revision }}
      labels:
        {{- include "orvyn.labels" . | nindent 4 }}

    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      ttlSecondsAfterFinished: 300

      containers:
        - name: bootstrap
          image: {{ .Values.storage.bootstrap.image | quote }}

          command:
            - /bin/sh
            - -ec
            - |
              export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
              export AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
              export AWS_DEFAULT_REGION="$S3_REGION"
              export AWS_MAX_ATTEMPTS=2

              until aws --endpoint-url "$S3_ENDPOINT" \
                s3api list-buckets >/dev/null 2>&1; do
                echo "Waiting for storage..."
                sleep 5
              done

              if aws --endpoint-url "$S3_ENDPOINT" \
                s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
                echo "Bucket already exists."
              else
                aws --endpoint-url "$S3_ENDPOINT" \
                  s3 mb "s3://$S3_BUCKET"
              fi

          env:
            {{- include "orvyn.storageEnv" . | nindent 12 }}
{{- end }}
