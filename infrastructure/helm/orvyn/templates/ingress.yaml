{{- if .Values.ingress.enabled }}
{{- $host := (urlParse .Values.global.origin).host -}}
{{- if contains ":" $host }}{{ fail "Ingress requires a DNS host without an explicit port in global.origin" }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "orvyn.fullname" . }}
  labels: {{- include "orvyn.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.ingress.annotations }}
  {{- if .Values.ingress.tls.issuer }}
  {{- $_ := unset $annotations "cert-manager.io/issuer" }}
  {{- $_ := unset $annotations "cert-manager.io/cluster-issuer" }}
  {{- $_ := set $annotations (ternary "cert-manager.io/cluster-issuer" "cert-manager.io/issuer" (eq .Values.ingress.tls.issuerKind "ClusterIssuer")) .Values.ingress.tls.issuer }}
  {{- end }}
  annotations: {{- toYaml $annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ .Values.ingress.tls.secretName | quote }}
      hosts: [{{ $host | quote }}]
  {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "orvyn.fullname" . }}-web
                port:
                  number: {{ .Values.web.service.port }}
{{- end }}
