apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orvyn.fullname" . }}-web
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "orvyn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web

  template:
    metadata:
      labels:
        {{- include "orvyn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web

    spec:
      automountServiceAccountToken: false

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: web
          image: {{ include "orvyn.image" (dict "root" . "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 3000

          env:
            - name: NUXT_API_URL
              value: http://{{ include "orvyn.fullname" . }}-api:3001

            - name: NUXT_COLLABORATION_UPSTREAM
              value: ws://{{ include "orvyn.fullname" . }}-collaboration:3002

            - name: NUXT_PUBLIC_COLLABORATION_URL
              value: ""

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15

          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}

      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orvyn.fullname" . }}-web
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}
spec:
  type: ClusterIP

  selector:
    {{- include "orvyn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web

  ports:
    - name: http
      port: 3000
      targetPort: http
