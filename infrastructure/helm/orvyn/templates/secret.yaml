{{- $name := include "orvyn.fullname" . -}}

{{- $encryptionKey := include "orvyn.secretValue" (dict
  "root" .
  "key" "ORVYN_ENCRYPTION_KEY"
  "value" .Values.global.encryptionKey
  "fallback" (randAlphaNum 64 | sha256sum)) -}}

{{- $dbPassword := include "orvyn.secretValue" (dict
  "root" .
  "key" "POSTGRES_PASSWORD"
  "value" .Values.postgresql.auth.password
  "fallback" (randAlphaNum 40)) -}}

{{- $redisPassword := include "orvyn.secretValue" (dict
  "root" .
  "key" "VALKEY_PASSWORD"
  "value" .Values.valkey.auth.password
  "fallback" (randAlphaNum 40)) -}}

{{- $accessKey := include "orvyn.secretValue" (dict
  "root" .
  "key" "S3_ACCESS_KEY_ID"
  "value" .Values.storage.accessKeyId
  "fallback" (randAlphaNum 20)) -}}

{{- $secretKey := include "orvyn.secretValue" (dict
  "root" .
  "key" "S3_SECRET_ACCESS_KEY"
  "value" .Values.storage.secretAccessKey
  "fallback" (randAlphaNum 40)) -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orvyn.secretName" . }}
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.global.existingEncryptionSecret }}
  ORVYN_ENCRYPTION_KEY: {{ $encryptionKey | quote }}
  {{- end }}

  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $dbPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" (.Values.postgresql.auth.username | urlquery) ($dbPassword | urlquery) $name (.Values.postgresql.auth.database | urlquery) | quote }}
  {{- else if not .Values.externalPostgresql.existingSecret }}
  DATABASE_URL: {{ required "externalPostgresql.url is required" .Values.externalPostgresql.url | quote }}
  {{- end }}

  {{- if .Values.valkey.enabled }}
  VALKEY_PASSWORD: {{ $redisPassword | quote }}
  REDIS_URL: {{ printf "redis://:%s@%s-valkey:6379/0" ($redisPassword | urlquery) $name | quote }}
  {{- else if not .Values.externalValkey.existingSecret }}
  REDIS_URL: {{ required "externalValkey.url is required" .Values.externalValkey.url | quote }}
  {{- end }}

  {{- if .Values.storage.internal.enabled }}
  S3_ACCESS_KEY_ID: {{ $accessKey | quote }}
  S3_SECRET_ACCESS_KEY: {{ $secretKey | quote }}

  s3.json: |-
    {
      "identities": [
        {
          "name": "orvyn",
          "credentials": [
            {
              "accessKey": {{ $accessKey | toJson }},
              "secretKey": {{ $secretKey | toJson }}
            }
          ],
          "actions": [
            "Admin",
            "Read",
            "List",
            "Tagging",
            "Write"
          ]
        }
      ]
    }

  {{- else if not .Values.storage.external.existingSecret }}
  S3_ACCESS_KEY_ID: {{ required "storage.accessKeyId is required" .Values.storage.accessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ required "storage.secretAccessKey is required" .Values.storage.secretAccessKey | quote }}
  {{- end }}

  {{- if not .Values.smtp.existingSecret }}
  SMTP_URL: {{ required "smtp.url or smtp.existingSecret is required" .Values.smtp.url | quote }}
  {{- end }}
