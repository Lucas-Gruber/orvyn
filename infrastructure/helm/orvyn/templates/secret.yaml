{{- include "orvyn.validate" . -}}
{{- $root := . -}}
{{- $data := dict -}}
{{- $previous := dict -}}
{{- if .Values.global.generateSecrets -}}
{{- $found := lookup "v1" "Secret" .Release.Namespace (include "orvyn.secretName" .) -}}
{{- if $found }}{{ $previous = default dict $found.data }}{{ end -}}
{{- end -}}
{{- $entries := list
  (dict "key" "ORVYN_ENCRYPTION_KEY" "value" .Values.global.encryptionKey "reference" .Values.global.existingEncryptionSecret "enabled" true "generate" true)
  (dict "key" "POSTGRES_PASSWORD" "value" .Values.postgresql.auth.password "reference" .Values.postgresql.auth.existingSecret "enabled" .Values.postgresql.enabled "generate" true)
  (dict "key" "VALKEY_PASSWORD" "value" .Values.valkey.auth.password "reference" .Values.valkey.auth.existingSecret "enabled" .Values.valkey.enabled "generate" true)
  (dict "key" "DATABASE_URL" "value" .Values.externalPostgresql.url "reference" .Values.externalPostgresql.existingSecret "enabled" (not .Values.postgresql.enabled) "generate" false)
  (dict "key" "REDIS_URL" "value" .Values.externalValkey.url "reference" .Values.externalValkey.existingSecret "enabled" (not .Values.valkey.enabled) "generate" false)
  (dict "key" "S3_ACCESS_KEY_ID" "value" .Values.storage.s3.accessKeyId "reference" .Values.storage.s3.existingSecret "enabled" (eq .Values.storage.driver "s3") "generate" .Values.storage.s3.internal.enabled)
  (dict "key" "S3_SECRET_ACCESS_KEY" "value" .Values.storage.s3.secretAccessKey "reference" .Values.storage.s3.existingSecret "enabled" (eq .Values.storage.driver "s3") "generate" .Values.storage.s3.internal.enabled)
  (dict "key" "SMTP_URL" "value" .Values.smtp.url "reference" .Values.smtp.existingSecret "enabled" true "generate" false)
  (dict "key" "ORVYN_OIDC_CLIENT_SECRET" "value" .Values.sso.oidc.clientSecret "reference" .Values.sso.oidc.existingSecret "enabled" (and .Values.sso.oidc.enabled (ne .Values.sso.oidc.clientAuthMethod "none")) "generate" false)
-}}
{{- range $entry := $entries -}}
{{- if and $entry.enabled (not $entry.reference) -}}
{{- $value := $entry.value -}}
{{- $old := get $previous $entry.key | default "" | b64dec -}}
{{- if and $old $value (ne $old $value) (has $entry.key (list "ORVYN_ENCRYPTION_KEY" "POSTGRES_PASSWORD")) }}{{ fail (printf "%s differs from the retained Secret; rotate data/database credentials explicitly before changing this value" $entry.key) }}{{ end -}}
{{- if not $value }}{{ $value = $old }}{{ end -}}
{{- if and (not $value) $entry.generate $root.Values.global.generateSecrets -}}
{{- $value = randAlphaNum 48 -}}
{{- if eq $entry.key "ORVYN_ENCRYPTION_KEY" }}{{ $value = randAlphaNum 64 | sha256sum }}{{ end -}}
{{- end -}}
{{- if not $value }}{{ fail (printf "%s must be supplied explicitly or through an existing Secret (automatic generation is unavailable or disabled)" $entry.key) }}{{ end -}}
{{- $_ := set $data $entry.key $value -}}
{{- end -}}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orvyn.secretName" . }}
  labels: {{- include "orvyn.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData: {{- toYaml $data | nindent 2 }}
{{- end }}
