apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orvyn.fullname" . }}-api
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}
    app.kubernetes.io/component: api

spec:
  replicas: {{ .Values.api.replicaCount }}

  selector:
    matchLabels:
      {{- include "orvyn.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api

  template:
    metadata:
      labels:
        {{- include "orvyn.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api

    spec:
      automountServiceAccountToken: false

      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: wait-for-storage
          image: {{ .Values.storage.bootstrap.image | quote }}

          command:
            - /bin/sh
            - -ec
            - |
              export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
              export AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
              export AWS_DEFAULT_REGION="$S3_REGION"
              export AWS_MAX_ATTEMPTS=2

              until aws --endpoint-url "$S3_ENDPOINT" \
                s3api head-bucket --bucket "$S3_BUCKET"; do
                echo "Waiting for S3 bucket..."
                sleep 5
              done

          env:
            {{- include "orvyn.storageEnv" . | nindent 12 }}

      containers:
        - name: api
          image: {{ include "orvyn.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 3001

          envFrom:
            - configMapRef:
                name: {{ include "orvyn.fullname" . }}-config

          env:
            {{- include "orvyn.databaseEnv" . | nindent 12 }}
            {{- include "orvyn.encryptionEnv" . | nindent 12 }}
            {{- include "orvyn.storageEnv" . | nindent 12 }}

            - name: MAX_UPLOAD_BYTES
              value: {{ .Values.api.maxUploadBytes | quote }}

          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15

          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}

      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orvyn.fullname" . }}-api
  labels:
    {{- include "orvyn.labels" . | nindent 4 }}
spec:
  type: ClusterIP

  selector:
    {{- include "orvyn.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

  ports:
    - name: http
      port: 3001
      targetPort: http
