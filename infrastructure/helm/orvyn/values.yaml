global:
  imageRegistry: ghcr.io
  imagePullSecrets: []
  storageClass: ""

  origin: https://orvyn.example.com

  encryptionKey: ""
  existingEncryptionSecret: ""
  encryptionSecretKey: ORVYN_ENCRYPTION_KEY

nameOverride: ""
fullnameOverride: ""

web:
  replicaCount: 1
  image:
    repository: lucas-gruber/orvyn-web
    tag: ""
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  replicaCount: 1
  image:
    repository: lucas-gruber/orvyn-api
    tag: ""
    pullPolicy: IfNotPresent
  maxUploadBytes: 10485760
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

worker:
  replicaCount: 1
  image:
    repository: lucas-gruber/orvyn-worker
    tag: ""
    pullPolicy: IfNotPresent
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

collaboration:
  replicaCount: 1
  image:
    repository: lucas-gruber/orvyn-collaboration
    tag: ""
    pullPolicy: IfNotPresent
  namespace: orvyn:collaboration
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgresql:
  enabled: true

  image:
    repository: docker.io/library/postgres
    tag: "17"
    pullPolicy: IfNotPresent

  auth:
    username: orvyn
    database: orvyn
    password: ""

  persistence:
    enabled: true
    storageClass: ""
    size: 10Gi

  resources: {}

externalPostgresql:
  url: ""
  existingSecret: ""
  secretKey: DATABASE_URL

valkey:
  enabled: true

  image:
    repository: docker.io/valkey/valkey
    tag: "8"
    pullPolicy: IfNotPresent

  auth:
    password: ""

  persistence:
    enabled: true
    storageClass: ""
    size: 2Gi

  resources: {}

externalValkey:
  url: ""
  existingSecret: ""
  secretKey: REDIS_URL

storage:
  internal:
    enabled: true

    image:
      repository: docker.io/chrislusf/seaweedfs
      tag: "latest"
      pullPolicy: IfNotPresent

    persistence:
      enabled: true
      storageClass: ""
      size: 20Gi

    resources: {}

  bucket: orvyn
  region: us-east-1
  forcePathStyle: true

  accessKeyId: ""
  secretAccessKey: ""

  external:
    endpoint: ""
    existingSecret: ""
    accessKeySecretKey: S3_ACCESS_KEY_ID
    secretAccessKeySecretKey: S3_SECRET_ACCESS_KEY

  bootstrap:
    image: docker.io/amazon/aws-cli:2.27.41

smtp:
  url: ""
  from: orvyn@example.com
  existingSecret: ""
  secretKey: SMTP_URL

ingress:
  enabled: true
  className: traefik

  annotations: {}

  hosts:
    - host: orvyn.example.com
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: orvyn-tls
      hosts:
        - orvyn.example.com
