# Public origin controls cookies, OIDC callbacks, ingress and TLS host.
# SMTP is mandatory: provide smtp.url or an existing Secret before installation.
# Empty application tags resolve to Chart.appVersion; digest takes precedence.
global:
  showAdvanced: false
  imageRegistry: ghcr.io
  imagePullSecrets: []
  storageClass: ""
  origin: https://orvyn.example.com
  generateSecrets: true
  encryptionKey: ""
  existingEncryptionSecret: ""
  encryptionSecretKey: ORVYN_ENCRYPTION_KEY
  secretRevision: ""
nameOverride: ""
fullnameOverride: ""
logging:
  level: info
auth:
  registration:
    enabled: true
    allowedEmailDomains: []
web:
  replicaCount: 1
  image:
    repository: lucas-gruber/orvyn-web
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
      cpu: "1"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  startupProbe:
    httpGet:
      path: /api/v1/health
      port: 3000
    failureThreshold: 90
    periodSeconds: 2
    timeoutSeconds: 3
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 3000
    periodSeconds: 5
    timeoutSeconds: 3
  livenessProbe:
    tcpSocket:
      port: 3000
    periodSeconds: 10
  service:
    type: ClusterIP
    port: 3000
api:
  replicaCount: 1
  image:
    repository: lucas-gruber/orvyn-api
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
      cpu: "1"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  startupProbe:
    httpGet:
      path: /api/v1/health
      port: 3001
    failureThreshold: 90
    periodSeconds: 2
    timeoutSeconds: 3
  readinessProbe:
    httpGet:
      path: /api/v1/health
      port: 3001
    periodSeconds: 5
    timeoutSeconds: 3
  livenessProbe:
    httpGet:
      path: /api/v1/live
      port: 3001
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 6
  service:
    type: ClusterIP
    port: 3001
  maxUploadBytes: 10485760
worker:
  replicaCount: 1
  image:
    repository: lucas-gruber/orvyn-worker
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
      cpu: "1"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  startupProbe: {}
  readinessProbe: {}
  livenessProbe: {}
collaboration:
  replicaCount: 1
  image:
    repository: lucas-gruber/orvyn-collaboration
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
      cpu: "1"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  startupProbe:
    httpGet:
      path: /health
      port: 3002
    failureThreshold: 90
    periodSeconds: 2
    timeoutSeconds: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 3002
    periodSeconds: 5
    timeoutSeconds: 3
  livenessProbe:
    tcpSocket:
      port: 3002
    periodSeconds: 10
  service:
    type: ClusterIP
    port: 3002
  namespace: orvyn:collaboration
postgresql:
  enabled: true
  image:
    repository: docker.io/library/postgres
    tag: "17"
    digest: sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    pullPolicy: IfNotPresent
  auth:
    username: orvyn
    database: orvyn
    password: ""
    existingSecret: ""
    secretKey: POSTGRES_PASSWORD
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 10Gi
    annotations: {}
    retain: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
      cpu: "1"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
externalPostgresql:
  url: ""
  existingSecret: ""
  secretKey: DATABASE_URL
# PostgreSQL snapshots only. Protect attachments and the encryption key separately.
backup:
  enabled: false
  schedule: "17 2 * * *"
  timeZone: Etc/UTC
  suspend: false
  retentionCount: 7
  startingDeadlineSeconds: 600
  activeDeadlineSeconds: 1800
  backoffLimit: 0
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  image:
    repository: docker.io/library/postgres
    tag: "17"
    digest: sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 20Gi
    annotations: {}
    retain: true
  ca:
    existingSecret: ""
    secretKey: ca.crt
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
      cpu: "1"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
valkey:
  enabled: true
  image:
    repository: docker.io/valkey/valkey
    tag: "8"
    digest: sha256:5032c4dd7abe08d6fd9382054608183e2bf1f7e3895ef619b8784698454325f7
    pullPolicy: IfNotPresent
  auth:
    password: ""
    existingSecret: ""
    secretKey: VALKEY_PASSWORD
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 2Gi
    annotations: {}
    retain: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
      cpu: "1"
  nodeSelector: {}
  affinity: {}
  tolerations: []
  podLabels: {}
  podAnnotations: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
externalValkey:
  url: ""
  existingSecret: ""
  secretKey: REDIS_URL
storage:
  driver: s3
  local:
    path: /data/attachments
    persistence:
      enabled: true
      existingClaim: ""
      storageClass: ""
      accessMode: ReadWriteOnce
      size: 20Gi
      annotations: {}
      retain: true
  s3:
    bucket: orvyn
    region: us-east-1
    forcePathStyle: true
    accessKeyId: ""
    secretAccessKey: ""
    existingSecret: ""
    accessKeySecretKey: S3_ACCESS_KEY_ID
    secretAccessKeySecretKey: S3_SECRET_ACCESS_KEY
    internal:
      enabled: true
      image:
        repository: docker.io/chrislusf/seaweedfs
        tag: ""
        digest: sha256:8779e14fbb8c76c607bc2ed934aeeb61e5319016f0ac1ba4667eae8f40fe623b
        pullPolicy: IfNotPresent
      persistence:
        enabled: true
        existingClaim: ""
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 20Gi
        annotations: {}
        retain: true
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
          cpu: "1"
      nodeSelector: {}
      affinity: {}
      tolerations: []
      podLabels: {}
      podAnnotations: {}
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL
    external:
      endpoint: ""
smtp:
  url: ""
  from: orvyn@example.com
  existingSecret: ""
  secretKey: SMTP_URL
sso:
  oidc:
    enabled: false
    name: Single sign-on
    issuer: ""
    clientId: ""
    clientAuthMethod: client_secret_basic
    clientSecret: ""
    existingSecret: ""
    secretKey: ORVYN_OIDC_CLIENT_SECRET
    scopes: openid email profile
    autoProvision: false
    repairLegacyIssuer: false
    adminSubject: ""
    ca:
      existingSecret: ""
      secretKey: ca.crt
ingress:
  enabled: true
  className: ""
  annotations: {}
  tls:
    enabled: true
    secretName: orvyn-tls
    issuer: ""
    issuerKind: ClusterIssuer
# Permission preparation for persistent data mounts; fsGroup mode has no root init.
volumePermissions:
  strategy: auto
  recursive: onRootMismatch
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      cpu: 500m
      memory: 128Mi
  securityContext:
    runAsUser: 0
    runAsNonRoot: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
      add: [CHOWN, FOWNER, DAC_OVERRIDE]
  probeSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
      add: []
configuration:
  reconcileIntervalSeconds: 30
  retryIntervalSeconds: 5
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
      cpu: "1"
  # Zero keeps internal storage bootstrap retrying after a backend outage.
  activeDeadlineSeconds: 0
  backoffLimit: 3
serviceAccount:
  create: true
  name: ""
  annotations: {}
