# Field types verified against rancher/dashboard df071f35b5da8c21e35b134fa72a03159058c01c (Questions components).
questions:
  - variable: global.showAdvanced
    label: Global / show Advanced
    type: boolean
    default: false
    group: General
  - variable: global.imageRegistry
    label: Global / image Registry
    type: string
    default: ghcr.io
    group: General
  - variable: global.imagePullSecrets
    label: Global / image Pull Secrets
    type: yaml
    default: []
    group: General
    show_if: global.showAdvanced=true
  - variable: global.storageClass
    label: Global / storage Class
    type: storageclass
    default: ""
    group: General
  - variable: global.origin
    label: Public application URL
    type: string
    default: https://orvyn.example.com
    group: General
    description: One public HTTPS origin without path or trailing slash. Controls
      secure cookies, ingress and OIDC callbacks. TLS may terminate at the
      ingress or an upstream load balancer.
  - variable: global.generateSecrets
    label: Generate missing secrets
    type: boolean
    default: true
    group: General
    description: Helm CLI can generate and reuse retained secrets with lookup.
      Disable for deterministic GitOps and supply all credentials or references.
  - variable: global.encryptionKey
    label: Persistent encryption key
    type: password
    default: ""
    group: General
    description: 64 hexadecimal characters. Keep a recoverable backup; never replace
      this key on an existing database.
  - variable: global.existingEncryptionSecret
    label: Existing encryption Secret
    type: secret
    default: ""
    group: General
    description: Secret in the release namespace. Takes precedence over inline
      configuration.
  - variable: global.encryptionSecretKey
    label: Global / encryption Secret Key
    type: string
    default: ORVYN_ENCRYPTION_KEY
    group: General
  - variable: global.secretRevision
    label: External Secret revision
    type: string
    default: ""
    group: General
    description: Change after rotating a referenced Secret to roll application pods.
      A Helm upgrade reruns OIDC configuration.
  - variable: nameOverride
    label: Name Override
    type: string
    default: ""
    group: Advanced
    show_if: global.showAdvanced=true
  - variable: fullnameOverride
    label: Fullname Override
    type: string
    default: ""
    group: Advanced
    show_if: global.showAdvanced=true
  - variable: logging.level
    label: Application log level
    type: enum
    default: info
    group: Logging and diagnostics
    description: Structured diagnostics for startup, storage, OIDC and dependency
      failures. Debug logging excludes credentials, tokens and raw error
      payloads.
    options:
      - debug
      - info
      - warn
      - error
  - variable: auth.registration.enabled
    label: Allow local account creation
    type: boolean
    default: true
    group: Authentication
    description: Controls local self-registration only. Existing password
      sign-in/recovery remains available; OIDC provisioning is controlled
      separately by the provider. Configure and test administrator access before
      disabling.
  - variable: auth.registration.allowedEmailDomains
    label: Allowed local registration email domains
    type: array[string]
    default: []
    group: Authentication
    description: Optional exact DNS domains, e.g. company.example. Use
      ASCII/Punycode; no wildcards or implicit subdomains. This does not
      restrict existing sign-in or OIDC provisioning.
  - variable: web.replicaCount
    label: Web / replica Count
    type: int
    default: 1
    group: Scaling
  - variable: web.image.repository
    label: Web / image / repository
    type: string
    default: lucas-gruber/orvyn-web
    group: Advanced
    show_if: global.showAdvanced=true
  - variable: web.image.tag
    label: Web / image / tag
    type: string
    default: ""
    group: Advanced
    show_if: global.showAdvanced=true
  - variable: web.image.digest
    label: Web / image / digest
    type: string
    default: ""
    group: Advanced
    description: Pinned digest takes precedence over tag. Clear the digest when
      intentionally selecting another image tag.
    show_if: global.showAdvanced=true
  - variable: web.image.pullPolicy
    label: Web / image / pull Policy
    type: enum
    default: IfNotPresent
    group: Advanced
    options:
      - IfNotPresent
      - Always
      - Never
    show_if: global.showAdvanced=true
  - variable: web.resources.requests.cpu
    label: Web / resources / requests / cpu
    type: string
    default: 100m
    group: Resources
  - variable: web.resources.requests.memory
