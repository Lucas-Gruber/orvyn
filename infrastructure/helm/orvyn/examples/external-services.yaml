global:
  origin: https://orvyn.example.com
  storageClass: longhorn

  existingEncryptionSecret: orvyn-encryption

web:
  replicaCount: 2

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

api:
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

worker:
  replicaCount: 1

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

collaboration:
  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

postgresql:
  enabled: false

externalPostgresql:
  existingSecret: orvyn-database
  secretKey: DATABASE_URL

valkey:
  enabled: true

  persistence:
    enabled: true
    size: 2Gi

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

storage:
  internal:
    enabled: true

    persistence:
      enabled: true
      size: 20Gi

smtp:
  from: orvyn@example.com
  existingSecret: orvyn-smtp

ingress:
  enabled: true
  className: traefik

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production

  hosts:
    - host: orvyn.example.com
      paths:
        - path: /
          pathType: Prefix

  tls:
    - secretName: orvyn-tls
      hosts:
        - orvyn.example.com
