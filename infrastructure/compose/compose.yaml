services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: orvyn
      POSTGRES_PASSWORD: ${ORVYN_DB_PASSWORD:?Set ORVYN_DB_PASSWORD}
      POSTGRES_DB: orvyn
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvyn"]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
volumes:
  postgres:
