name: Server release
on:
  push:
    tags: ["v*"]
# Serialization also protects latest from a delayed older release.
concurrency:
  group: orvyn-server-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, node24
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, node24
        with:
          node-version: "24"
      - name: Verify tag, manifests and main ancestry
        id: plan
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$commit" origin/main
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          node scripts/release.mjs plan > release-plan.json
          node -e 'const p=require("./release-plan.json");require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT,"version="+p.version+"\n")'
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  images:
    needs: [validate, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [web, api, collaboration, worker]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, node24
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4, node24
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4, node24
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4, node24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare registry reference
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "candidate=$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Build candidate with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7, node24
        with:
          context: .
          file: infrastructure/docker/Dockerfile
          target: ${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.candidate }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ needs.validate.outputs.commit }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.component }}
      - name: Record immutable candidate digest
        env:
          COMPONENT: ${{ matrix.component }}
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: |
          mkdir -p image-record
          node -e 'const e=process.env;require("node:fs").writeFileSync("image-record/"+e.COMPONENT+".json",JSON.stringify({component:e.COMPONENT,image:e.IMAGE,digest:e.DIGEST,version:e.VERSION,commit:e.RELEASE_COMMIT}))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7, node24
        with:
          name: image-${{ matrix.component }}-${{ github.run_attempt }}
          path: image-record/*.json
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: [validate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, node24
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4, node24
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4, node24
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3, composite with verified bootstrap
        with:
          cosign-release: v2.5.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8, node24
        with:
          pattern: image-*
          path: artifacts
          merge-multiple: false
      - name: Sign, promote immutable versions and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: node scripts/release-publish.mjs
